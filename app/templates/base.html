<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a1413" />
  <title>{% block title %}Retail BI{% endblock %} · {{ business.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <div class="brand-name">Vantiq</div>
          <div class="brand-sub">Retail BI Kit</div>
        </div>
      </div>

      <div class="biz-card">
        <div class="name">{{ business.name }}</div>
        <div class="meta"><span class="dot"></span>{{ business.currency_code }}</div>
      </div>

      <nav class="nav">
        <a href="/" class="{{ 'active' if active == 'dashboard' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          Dashboard
        </a>
        <a href="/sales" class="{{ 'active' if active == 'sales' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h12a1 1 0 0 1 1 1V21l-3.5-2-3.5 2-3.5-2L5 21V3.5a1 1 0 0 1 1-1z"/><path d="M9 7h6M9 11h6"/></svg>
          Sales
        </a>
        <a href="/products" class="{{ 'active' if active == 'products' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6 21 7v10l-9 4.4L3 17V7l9-4.4z"/><path d="M3 7l9 4.4L21 7"/><path d="M12 11.4V21"/></svg>
          Inventory
        </a>
        <a href="/stock" class="{{ 'active' if active == 'stock' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 8l-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
          Stock
        </a>
        <a href="/expenses" class="{{ 'active' if active == 'expenses' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.6"/><path d="M3 10.5h18"/><circle cx="16.6" cy="14.8" r="1.1"/></svg>
          Expenses
        </a>
        <a href="/settings" class="{{ 'active' if active == 'settings' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2M12 19.4v2M4.3 12H2.3M21.7 12h-2M6.4 6.4 4.9 4.9M19.1 19.1l-1.5-1.5M17.6 6.4l1.5-1.5M4.9 19.1l1.5-1.5"/></svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-foot">
        <span class="email">{{ user.display_name if user else '' }}</span>
        <form action="/logout" method="post"><button type="submit">Sign out</button></form>
      </div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
