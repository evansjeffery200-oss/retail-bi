<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · {{ business.name }}</title>
  <meta name="theme-color" content="#0a1413" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-mark">V</div>
        <h1>Retail <em style="color:var(--accent);font-style:italic">BI Kit</em></h1>
        <p>{{ business.name }} · Sign in</p>
      </div>

      <form class="card card-body" action="/login" method="post">
        <div style="margin-bottom:14px">
          <label class="label" for="email">Email</label>
          <input class="field" id="email" name="email" type="email" autocomplete="username" value="{{ email }}" required />
        </div>
        <div style="margin-bottom:14px">
          <label class="label" for="password">Password</label>
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        {% if error %}<div class="alert" style="margin-bottom:12px">{{ error }}</div>{% endif %}

        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <p class="auth-foot">
        {% if signup_open %}
          New here? <a href="/signup">Create an account</a><br />
        {% else %}
          New accounts are closed for now.<br />
        {% endif %}
        <a href="/welcome" class="link-quiet">Back to welcome</a>
      </p>
    </div>
  </div>
</body>
</html>
