services:
  - type: web
    name: retail-bi
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INITIAL_EMAIL
        sync: false
      - key: INITIAL_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: CURRENCY_CODE
        value: NGN
      - key: CURRENCY_LOCALE
        value: en-NG
      - key: COOKIE_SECURE
        value: "true"
